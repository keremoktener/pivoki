[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pivoki-desktop"
version = "0.1.0"
description = "Pivoki Linux desktop workspace"
requires-python = ">=3.11"
license = "LicenseRef-Pivoki-Personal-Noncommercial-1.0"
dependencies = ["pivoki-engine>=0.1,<0.2", "pivoki-studio>=0.1,<0.2"]

[project.optional-dependencies]
drop = ["tkinterdnd2>=0.7,<1"]

[project.scripts]
pivoki-desktop = "pivoki_linux.app:main"

[tool.setuptools.packages.find]
where = ["src"]
