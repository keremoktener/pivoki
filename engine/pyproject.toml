[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivoki-engine"
version = "0.1.0"
description = "Local Pivoki image planner, transactional package publisher and CLI"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<14"]

[project.optional-dependencies]
heif = ["pillow-heif>=1,<3"]
test = ["pytest>=8"]

[project.scripts]
pivoki-engine = "pivoki_engine.cli:main"
pivoki = "pivoki_engine.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
